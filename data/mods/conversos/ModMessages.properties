model.foundingFather.bartolomeDeLasCasas.description=Indian converts gain experience in outdoor work (farming, fishing, trapping, lumber, mining and plantations) and in guild crafts (carpentry, distilling, weaving, cigars, coats, tools, muskets). They may become native field experts or native guild apprentices. They remain converts: they cannot found colonies, are poor at untrained indoor work and cannot teach.

model.unit.indianConvert.description=The Indian Convert is a native who has joined one of your colonies. He is skilled at all kinds of outdoor work, but unskilled at indoor work. Once Bartolome de las Casas joins the Continental Congress, converts gain experience in outdoor work and guild crafts and may become native experts or native guild apprentices.

model.unit.nativeExpertFarmer.name={{plural:%number%|one=Native Expert Farmer|other=Native Expert Farmers|default=Native Expert Farmer}}
model.unit.nativeExpertFarmer.description=A convert who mastered farming by experience. Produces more grain than a European expert farmer, but remains a convert: no colonies, poor indoor work, no teaching.
