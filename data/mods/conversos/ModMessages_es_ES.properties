model.foundingFather.bartolomeDeLasCasas.description=Los indios conversos ganan experiencia en los trabajos de campo (cultivo, pesca, caza de pieles, madera, minería y plantaciones) y pueden volverse expertos nativos. Siguen siendo conversos: no fundan colonias, rinden poco dentro de los edificios y no enseñan.

model.unit.indianConvert.description=El Indio Converso es un nativo que se ha unido a una de nuestras colonias. Es hábil en los trabajos de campo pero no en los de los edificios. Cuando Bartolomé de las Casas se une al Congreso Continental, los conversos ganan experiencia en los trabajos de campo y pueden volverse expertos nativos.

