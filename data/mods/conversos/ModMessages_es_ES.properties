model.foundingFather.bartolomeDeLasCasas.description=Los indios conversos ganan experiencia en los trabajos de campo (cultivo, pesca, caza de pieles, madera, minería y plantaciones) y en oficios de gremio (carpintería, destilación, tejido, cigarros, abrigos, herramientas, mosquetes). Pueden volverse expertos nativos de campo o aprendices nativos de gremio. Siguen siendo conversos: no fundan colonias, rinden poco en oficios sin entrenar y no enseñan.

model.unit.indianConvert.description=El Indio Converso es un nativo que se ha unido a una de nuestras colonias. Es hábil en los trabajos de campo pero no en los de los edificios. Cuando Bartolomé de las Casas se une al Congreso Continental, los conversos ganan experiencia en campo y gremio y pueden volverse expertos nativos o aprendices nativos de gremio.

