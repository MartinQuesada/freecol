model.building.timberMill.name=Timber mill
model.building.timberMill.description=The timber mill upgrades the lumber mill and further increases hammer production. It requires Adam Smith and a colony population of at least 8.

model.building.cityHall.name=City Hall
model.building.cityHall.description=The city hall upgrades the town hall and increases liberty bell production. It can be built when the colony population reaches 8. A printing press and newspaper still stack with its effect.

model.building.basilica.name=Basilica
model.building.basilica.description=The basilica upgrades the cathedral and further increases cross production. It can be built when the colony population reaches 12.\n\nAfter building a basilica cross production increases.

model.building.citadel.name=Citadel
model.building.citadel.description=The citadel upgrades the fortress and further strengthens colony defence. It can be built when the colony population reaches 12. The citadel still bombards privateers and enemy naval units on adjacent ocean tiles.\n\nBuilding a citadel increases defense by 250%.

# Clarify that these can now be upgraded
model.building.lumberMill.description=The lumber mill, which can be upgraded to a timber mill, is used to convert lumber to hammers. Hammers are required to construct or upgrade all kinds of buildings. A lumber mill increases hammer production.
model.building.townHall.description=The town hall, which can be upgraded to a city hall, provides workplaces for up to three colonists producing liberty bells. Its effect can also be increased by building a printing press and a newspaper.
model.building.church.description=A colony with a population of 3 or more may build a church, which can be upgraded to a cathedral as soon as the population reaches 8, and later to a basilica at population 12. The religious freedom of the New World (symbolized by crosses) causes increased emigration from Europe.\n\nAfter building a church cross production increases and you are allowed to commission missionaries.
model.building.cathedral.description=A colony with a population of 3 or more may build a church, which can be upgraded to a cathedral as soon as the population reaches 8, and later to a basilica at population 12. The religious freedom of the New World (symbolized by crosses) causes increased emigration from Europe.\n\nAfter building a cathedral cross production increases.
model.building.fort.description=The fort, which can only be constructed after building a stockade, protects the colonists from attacks. The fort provides protection and bombards privateers and enemy naval units on adjacent ocean tiles. The fort can be replaced by a fortress as soon as the population reaches 8, and later by a citadel at population 12.\n\nBuilding a fort increases defense by 150%.
model.building.fortress.description=The fortress, which can be constructed after building a fort and when population has reached 8, protects the colonists from attacks. The fortress provides protection and bombards privateers and enemy naval units on adjacent ocean tiles. It can be upgraded to a citadel when the population reaches 12.\n\nBuilding a fortress increases defense by 200%.
