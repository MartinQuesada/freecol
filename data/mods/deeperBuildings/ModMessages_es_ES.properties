model.building.timberMill.name=Aserradero industrial
model.building.timberMill.description=El aserradero industrial mejora el aserradero y aumenta aún más la producción de martillos. Requiere a Adam Smith y una población de al menos 8.

model.building.cityHall.name=Cabildo
model.building.cityHall.description=El cabildo mejora el ayuntamiento y aumenta la producción de campanas de la libertad. Se puede construir cuando la colonia alcanza 8 de población. La prensa y el periódico siguen sumando a su efecto.

model.building.basilica.name=Basílica
model.building.basilica.description=La basílica mejora la catedral y aumenta aún más la producción de cruces. Se puede construir cuando la colonia alcanza 12 de población.\n\nDespués de construir una basílica la producción de cruces aumenta.

model.building.citadel.name=Ciudadela
model.building.citadel.description=La ciudadela mejora la fortaleza y refuerza aún más la defensa de la colonia. Se puede construir cuando la colonia alcanza 12 de población. La ciudadela sigue bombardeando corsarios y unidades navales enemigas en casillas de océano adyacentes.\n\nConstruir una ciudadela aumenta la defensa un 250%.

# Clarify that these can now be upgraded
model.building.lumberMill.description=El aserradero, que puede evolucionar a aserradero industrial, se usa para convertir madera en martillos. Los martillos se usan para construir o evolucionar todo tipo de edificios. Un aserradero aumenta la producción de martillos.
model.building.townHall.description=El ayuntamiento, que puede evolucionar a cabildo, provee espacio de hasta tres colonos para producir campanas de la libertad. Su efecto también puede incrementarse construyendo una prensa y un periódico.
model.building.church.description=Una colonia con una población de 3 ó mas puede construir una iglesia, que puede evolucionar a catedral tan pronto como la colonia alcance 8 de población, y más tarde a basílica con 12. La libertad religiosa del Nuevo Mundo (simbolizada por cruces) causa un incremento de inmigración desde Europa.\n\nDespués de construir una iglesia la producción de cruces aumenta y se pueden poner en servicio los misioneros.
model.building.cathedral.description=Una colonia que haya alcanzado 3 de población puede construir una iglesia, que puede evolucionar a catedral tan pronto como la población alcance 8, y más tarde a basílica con 12. La libertad religiosa en el Nuevo Mundo (simbolizada por las cruces) causa un incremento de la inmigración desde Europa.\n\nDespués de construir una catedral la producción de cruces aumenta.
model.building.fort.description=El fuerte, que se puede construir sólo si existe una empalizada, protege a los colonos de ataques. El fuerte provee una mejor protección y bombardea a los corsarios y unidades navales enemigas en casillas de océano adyacentes. El fuerte puede reemplazarse por una fortaleza tan pronto como la población alcance 8, y más tarde por una ciudadela con 12.\n\nConstruir un fuerte aumenta la defensa un 150%.
model.building.fortress.description=La fortaleza, que sólo se puede construir si se ha construido el fuerte y cuando la población alcance 8, protege a los colonos de ataques. La fortaleza provee mejor protección y ataca corsarios y unidades navales enemigas en casillas de océano adyacentes. Puede evolucionar a ciudadela cuando la población alcance 12.\n\nConstruir una fortaleza aumenta la defensa un 200%.
