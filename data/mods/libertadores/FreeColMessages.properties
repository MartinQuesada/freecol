mod.libertadores.name=Libertadores
mod.libertadores.shortDescription=Founding fathers: Hamilton, Humboldt, San Martín, Miranda, Sor Juana, Orellana, Toussaint, da Gama, Whitney, Lezo. Replaces Fugger and Hudson.
mod.libertadores.license=GPL

colopedia.concepts.taxes.description=<html><p>Early in the game, the Monarch does not levy any taxes on your income. Over time, however, the Monarch will be sure to increase sales taxes for a number of reasons that you may find more or less convincing. Every time the Monarch proposes to increase taxes, you may refuse. In that case, a particular type of goods will be boycotted, which means that you will no longer be able to buy or sell that type of goods in Europe, and up to one hundred items of that type of goods will be destroyed by enraged colonists in one of your colonies.</p><p>Boycotts can be lifted by paying your tax arrears (a costly business), or by the election of <a href="http:///id/model.foundingFather.alexanderHamilton">Alexander Hamilton</a> to the Continental Congress.</p></html>
