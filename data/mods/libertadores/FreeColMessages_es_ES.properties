colopedia.concepts.taxes.description=<html><p>Al principio del juego, el Monarca no impone impuestos sobre tus ingresos. Con el tiempo, sin embargo, el Monarca aumentará los impuestos de venta por diversas razones más o menos convincentes. Cada vez que el Monarca proponga subir impuestos, puedes negarte. En ese caso, un tipo de mercancía quedará boicoteado: ya no podrás comprarlo ni venderlo en Europa, y hasta cien unidades de esa mercancía serán destruidas por colonos enfurecidos en una de tus colonias.</p><p>Los boicots se levantan pagando los impuestos atrasados (caro) o eligiendo a <a href="http:///id/model.foundingFather.alexanderHamilton">Alexander Hamilton</a> para el Congreso Continental.</p></html>
