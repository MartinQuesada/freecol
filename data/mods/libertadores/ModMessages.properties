model.foundingFather.alexanderHamilton.name=Alexander Hamilton
model.foundingFather.alexanderHamilton.description=Increases tool production by 50%.
model.foundingFather.alexanderHamilton.text=First U.S. Secretary of the Treasury and architect of early American public finance. His 1791 Report on Manufactures argued that the young republic should build its own industry instead of relying on imported goods.
model.foundingFather.alexanderHamilton.birthAndDeath=1755/57-1804

model.foundingFather.alexanderVonHumboldt.name=Alexander von Humboldt
model.foundingFather.alexanderVonHumboldt.description=Increases grain and fish production by 50%.
model.foundingFather.alexanderVonHumboldt.text=German naturalist and explorer who mapped much of Spanish America and pioneered modern biogeography. His scientific travels reshaped European understanding of New World climates, plants and resources.
model.foundingFather.alexanderVonHumboldt.birthAndDeath=1769-1859

model.foundingFather.joseDeSanMartin.name=José de San Martín
model.foundingFather.joseDeSanMartin.description=Sons of Liberty membership in all existing colonies is increased by 10%. Soldiers and dragoons gain 25% offence.
model.foundingFather.joseDeSanMartin.text=Argentine general who led the Army of the Andes across the mountains to liberate Chile and later Peru from Spanish rule. Remembered as one of the great liberators of South America.
model.foundingFather.joseDeSanMartin.birthAndDeath=1778-1850

model.foundingFather.franciscoDeMiranda.name=Francisco de Miranda
model.foundingFather.franciscoDeMiranda.description=Increases the production of liberty bells by 50%.
model.foundingFather.franciscoDeMiranda.text=Venezuelan revolutionary and precursor of Spanish-American independence. He fought in the American and French revolutions and dreamed of a free and united Hispanic America long before Bolívar's campaigns.
model.foundingFather.franciscoDeMiranda.birthAndDeath=1750-1816

model.foundingFather.sorJuanaInesDeLaCruz.name=Sor Juana Inés de la Cruz
model.foundingFather.sorJuanaInesDeLaCruz.description=Cross production increases by 25%. Schoolhouses, colleges and universities cost 50% less to build.
model.foundingFather.sorJuanaInesDeLaCruz.text=Hieronymite nun, poet and scholar of New Spain. A fierce defender of women's right to education and one of the greatest writers of the colonial Baroque.
model.foundingFather.sorJuanaInesDeLaCruz.birthAndDeath=1648-1695

model.foundingFather.franciscoDeOrellana.name=Francisco de Orellana
model.foundingFather.franciscoDeOrellana.description=All land units gain +1 line of sight and +1 movement.
model.foundingFather.franciscoDeOrellana.text=Spanish explorer who completed the first known navigation of the Amazon River from the Andes to the Atlantic, opening European knowledge of the great river basin.
model.foundingFather.franciscoDeOrellana.birthAndDeath=1511-1546

model.foundingFather.toussaintLouverture.name=Toussaint Louverture
model.foundingFather.toussaintLouverture.description=Sons of Liberty membership in all existing colonies is increased by 15%. Soldiers and dragoons gain 25% defence.
model.foundingFather.toussaintLouverture.text=Leader of the Haitian Revolution who transformed a slave uprising into a disciplined army and secured the independence of Saint-Domingue, the first free black republic in the Americas.
model.foundingFather.toussaintLouverture.birthAndDeath=1743-1803

model.foundingFather.vascoDaGama.name=Vasco da Gama
model.foundingFather.vascoDaGama.description=Naval units gain +1 movement and travel to and from Europe one turn faster.
model.foundingFather.vascoDaGama.text=Portuguese navigator who opened the sea route from Europe to India around the Cape of Good Hope (1497–1499), linking Atlantic and Indian Ocean trade for the Portuguese crown.
model.foundingFather.vascoDaGama.birthAndDeath=c.1469-1524

model.foundingFather.eliWhitney.name=Eli Whitney
model.foundingFather.eliWhitney.description=Increases cotton and musket production by 50%.
model.foundingFather.eliWhitney.text=American inventor of the cotton gin and a pioneer of interchangeable parts in musket manufacture. His machines shaped both southern agriculture and northern industry in the early United States.
model.foundingFather.eliWhitney.birthAndDeath=1765-1825

model.foundingFather.blasDeLezo.name=Blas de Lezo
model.foundingFather.blasDeLezo.description=All land units gain 50% defence.
model.foundingFather.blasDeLezo.text=Spanish admiral who lost an eye, a leg and an arm in earlier wars, then held Cartagena de Indias against a vastly larger British fleet in 1741. Remembered as one of the great defensive commanders of the colonial Caribbean.
model.foundingFather.blasDeLezo.birthAndDeath=1689-1741

model.foundingFather.thomasCochrane.name=Thomas Cochrane
model.foundingFather.thomasCochrane.description=All naval units gain 50% offence.
model.foundingFather.thomasCochrane.text=Scottish naval officer who commanded the fleets of Chile, Peru and Brazil in their wars of independence. His daring raids, such as the capture of the Esmeralda at Callao in 1820, swept Spanish and Portuguese ships from the Pacific and the Atlantic coast.
model.foundingFather.thomasCochrane.birthAndDeath=1775-1860

model.foundingFather.miguelHidalgo.name=Miguel Hidalgo
model.foundingFather.miguelHidalgo.description=Sons of Liberty membership in all colonies is increased by 10%. Native tension grows 25% more slowly.
model.foundingFather.miguelHidalgo.text=Parish priest of Dolores who launched the Mexican War of Independence with the Grito de Dolores in 1810. His army was made up largely of indigenous and mestizo peasants, and he is remembered as the father of the Mexican nation.
model.foundingFather.miguelHidalgo.birthAndDeath=1753-1811

model.foundingFather.antonioVieira.name=Antonio Vieira
model.foundingFather.antonioVieira.description=Increases the chance of natives converting by 20%.
model.foundingFather.antonioVieira.text=Portuguese Jesuit, preacher and diplomat who spent decades in Brazil defending the natives against enslavement by the colonists. His sermons are among the classics of the Portuguese language.
model.foundingFather.antonioVieira.birthAndDeath=1608-1697

model.foundingFather.roqueGonzalez.name=Roque Gonzalez de Santa Cruz
model.foundingFather.roqueGonzalez.description=Indian converts and native experts produce 1 more grain, sugar, tobacco, cotton, furs and fish.
model.foundingFather.roqueGonzalez.text=Jesuit born in Asuncion who founded several of the Guarani reductions of Paraguay, where native communities farmed, raised cattle and worked crafts under the missionaries' protection. He was killed in 1628 and canonized in 1988.
model.foundingFather.roqueGonzalez.birthAndDeath=1576-1628

model.foundingFather.felixDeAzara.name=Felix de Azara
model.foundingFather.felixDeAzara.description=Horses and other livestock breed 50% faster.
model.foundingFather.felixDeAzara.text=Spanish military engineer and naturalist who spent twenty years in Paraguay and the Rio de la Plata. He described hundreds of species and studied the wild horses and cattle of the pampas, work later cited by Darwin.
model.foundingFather.felixDeAzara.birthAndDeath=1742-1821

model.foundingFather.jorgeJuanYUlloa.name=Jorge Juan and Antonio de Ulloa
model.foundingFather.jorgeJuanYUlloa.description=The land around all your colonies is revealed. Naval units gain +1 line of sight.
model.foundingFather.jorgeJuanYUlloa.text=Two young Spanish naval officers who joined the French Geodesic Mission to the Viceroyalty of Peru in 1735 to measure the shape of the Earth. Their surveys and reports gave Spain its most accurate knowledge of its American lands and coasts.
model.foundingFather.jorgeJuanYUlloa.birthAndDeath=1713-1773 / 1716-1795

model.foundingFather.rogerWilliams.name=Roger Williams
model.foundingFather.rogerWilliams.description=Cross production is increased by 25%. Native tension grows 25% more slowly.
model.foundingFather.rogerWilliams.text=Puritan minister banished from Massachusetts for his views, who founded Providence and the colony of Rhode Island on the principle of religious freedom. He learned the Narragansett language and insisted on buying land from the natives instead of taking it.
model.foundingFather.rogerWilliams.birthAndDeath=1603-1683

model.foundingFather.jeanBaptisteColbert.name=Jean-Baptiste Colbert
model.foundingFather.jeanBaptisteColbert.description=Rum, cigar, cloth and coat production is increased by 25%.
model.foundingFather.jeanBaptisteColbert.text=Finance minister of Louis XIV and the great architect of French mercantilism. He founded royal manufactures, the French West India Company and the navy that tied New France and the Antilles to the home country.
model.foundingFather.jeanBaptisteColbert.birthAndDeath=1619-1683

model.foundingFather.johnRolfe.name=John Rolfe
model.foundingFather.johnRolfe.description=Tobacco production is increased by 50%.
model.foundingFather.johnRolfe.text=English settler of Jamestown who planted a sweeter Caribbean tobacco in 1612 and turned it into Virginia's first profitable export. His marriage to Pocahontas in 1614 brought a few years of peace with the Powhatan.
model.foundingFather.johnRolfe.birthAndDeath=1585-1622

model.foundingFather.samuelDeChamplain.name=Samuel de Champlain
model.foundingFather.samuelDeChamplain.description=A seasoned scout joins you in Europe. Native tension grows 25% more slowly.
model.foundingFather.samuelDeChamplain.text=French navigator and cartographer who founded Quebec in 1608 and explored the Saint Lawrence and the Great Lakes. His alliance with the Huron and Algonquin shaped New France for a century.
model.foundingFather.samuelDeChamplain.birthAndDeath=c.1567-1635

model.foundingFather.michielDeRuyter.name=Michiel de Ruyter
model.foundingFather.michielDeRuyter.description=All naval units gain 50% defence.
model.foundingFather.michielDeRuyter.text=The most celebrated admiral of the Dutch Republic. He fought the English and French fleets to a standstill and led the raid on the Medway in 1667, which burned the English fleet at anchor.
model.foundingFather.michielDeRuyter.birthAndDeath=1607-1676

model.foundingFather.vauban.name=Vauban
model.foundingFather.vauban.description=Stockades, forts and fortresses cost 50% less to buy.
model.foundingFather.vauban.text=Sebastien Le Prestre, marquis de Vauban, military engineer of Louis XIV. He built or rebuilt more than a hundred fortresses, and his star-shaped forts were copied across Europe and the Americas.
model.foundingFather.vauban.birthAndDeath=1633-1707

model.foundingFather.marieDeLIncarnation.name=Marie de l'Incarnation
model.foundingFather.marieDeLIncarnation.description=A schoolhouse is built for free in every colony that can have one.
model.foundingFather.marieDeLIncarnation.text=Ursuline nun who arrived in Quebec in 1639 and founded the first school for girls in North America, open to French and native pupils alike. She also wrote dictionaries of the Algonquin and Iroquois languages.
model.foundingFather.marieDeLIncarnation.birthAndDeath=1599-1672
