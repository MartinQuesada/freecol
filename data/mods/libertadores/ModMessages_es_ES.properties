model.foundingFather.alexanderHamilton.name=Alexander Hamilton
model.foundingFather.alexanderHamilton.description=Aumenta la producción de herramientas en un 50%.
model.foundingFather.alexanderHamilton.text=Primer secretario del Tesoro de Estados Unidos y arquitecto de las finanzas públicas tempranas. En su Informe sobre las manufacturas (1791) sostuvo que la joven república debía desarrollar su propia industria en lugar de depender de bienes importados.
model.foundingFather.alexanderHamilton.birthAndDeath=1755/57-1804

model.foundingFather.alexanderVonHumboldt.name=Alexander von Humboldt
model.foundingFather.alexanderVonHumboldt.description=Aumenta la producción de grano y pescado en un 50%.
model.foundingFather.alexanderVonHumboldt.text=Naturalista y explorador alemán que recorrió gran parte de la América española y sentó las bases de la biogeografía moderna. Sus viajes científicos transformaron la comprensión europea del clima, la flora y los recursos del Nuevo Mundo.
model.foundingFather.alexanderVonHumboldt.birthAndDeath=1769-1859

model.foundingFather.joseDeSanMartin.name=José de San Martín
model.foundingFather.joseDeSanMartin.description=La afiliación de Hijos de la Libertad en las colonias aumenta en un 10%. Soldados y dragones ganan un 25% de ataque.
model.foundingFather.joseDeSanMartin.text=General argentino que cruzó los Andes al frente del Ejército de los Andes para liberar Chile y luego el Perú del dominio español. Recordado como uno de los grandes libertadores de América del Sur.
model.foundingFather.joseDeSanMartin.birthAndDeath=1778-1850

model.foundingFather.franciscoDeMiranda.name=Francisco de Miranda
model.foundingFather.franciscoDeMiranda.description=Aumenta la producción de campanas de la libertad en un 50%.
model.foundingFather.franciscoDeMiranda.text=Revolucionario venezolano y precursor de la independencia hispanoamericana. Combatió en las revoluciones norteamericana y francesa, y soñó con una América hispana libre y unida mucho antes de las campañas de Bolívar.
model.foundingFather.franciscoDeMiranda.birthAndDeath=1750-1816

model.foundingFather.sorJuanaInesDeLaCruz.name=Sor Juana Inés de la Cruz
model.foundingFather.sorJuanaInesDeLaCruz.description=La producción de cruces aumenta un 25%. Escuelas, colegios y universidades cuestan un 50% menos.
model.foundingFather.sorJuanaInesDeLaCruz.text=Monja jerónima, poeta y erudita de la Nueva España. Ferviente defensora del derecho de las mujeres a la educación y una de las mayores escritoras del barroco colonial.
model.foundingFather.sorJuanaInesDeLaCruz.birthAndDeath=1648-1695

model.foundingFather.franciscoDeOrellana.name=Francisco de Orellana
model.foundingFather.franciscoDeOrellana.description=Todas las unidades terrestres ganan +1 de visión y +1 de movimiento.
model.foundingFather.franciscoDeOrellana.text=Explorador español que completó la primera navegación conocida del río Amazonas desde los Andes hasta el Atlántico, abriendo el conocimiento europeo de la gran cuenca amazónica.
model.foundingFather.franciscoDeOrellana.birthAndDeath=1511-1546

model.foundingFather.toussaintLouverture.name=Toussaint Louverture
model.foundingFather.toussaintLouverture.description=La afiliación de Hijos de la Libertad en las colonias aumenta en un 15%. Soldados y dragones ganan un 25% de defensa.
model.foundingFather.toussaintLouverture.text=Líder de la Revolución haitiana que transformó una sublevación de esclavos en un ejército disciplinado y aseguró la independencia de Saint-Domingue, la primera república negra libre de América.
model.foundingFather.toussaintLouverture.birthAndDeath=1743-1803

model.foundingFather.vascoDaGama.name=Vasco da Gama
model.foundingFather.vascoDaGama.description=Las unidades navales ganan +1 de movimiento y el viaje a/desde Europa dura un turno menos.
model.foundingFather.vascoDaGama.text=Navegante portugués que abrió la ruta marítima de Europa a la India doblando el cabo de Buena Esperanza (1497–1499), uniendo el comercio atlántico e índico para la corona portuguesa.
model.foundingFather.vascoDaGama.birthAndDeath=c.1469-1524

model.foundingFather.eliWhitney.name=Eli Whitney
model.foundingFather.eliWhitney.description=Aumenta la producción de algodón y mosquetes en un 50%.
model.foundingFather.eliWhitney.text=Inventor estadounidense de la desmotadora de algodón y pionero de las piezas intercambiables en la fabricación de mosquetes. Sus máquinas marcaron la agricultura del Sur y la industria del Norte en los primeros Estados Unidos.
model.foundingFather.eliWhitney.birthAndDeath=1765-1825

model.foundingFather.blasDeLezo.name=Blas de Lezo
model.foundingFather.blasDeLezo.description=Todas las unidades terrestres ganan un 50% de defensa.
model.foundingFather.blasDeLezo.text=Almirante español que perdió un ojo, una pierna y un brazo en guerras anteriores, y luego defendió Cartagena de Indias frente a una flota británica mucho mayor en 1741. Recordado como uno de los grandes comandantes defensivos del Caribe colonial.
model.foundingFather.blasDeLezo.birthAndDeath=1689-1741

model.foundingFather.thomasCochrane.name=Thomas Cochrane
model.foundingFather.thomasCochrane.description=Todas las unidades navales ganan un 50% de ataque.
model.foundingFather.thomasCochrane.text=Marino escocés que comandó las escuadras de Chile, Perú y Brasil en sus guerras de independencia. Sus golpes audaces, como la captura de la Esmeralda en el Callao en 1820, barrieron a las flotas española y portuguesa del Pacífico y de la costa atlántica.
model.foundingFather.thomasCochrane.birthAndDeath=1775-1860

model.foundingFather.miguelHidalgo.name=Miguel Hidalgo
model.foundingFather.miguelHidalgo.description=La afiliación de Hijos de la Libertad en las colonias aumenta en un 10%. La tensión con los nativos crece un 25% más despacio.
model.foundingFather.miguelHidalgo.text=Cura de Dolores que inició la guerra de independencia de México con el Grito de Dolores en 1810. Su ejército estaba formado sobre todo por campesinos indígenas y mestizos, y se lo recuerda como el padre de la patria mexicana.
model.foundingFather.miguelHidalgo.birthAndDeath=1753-1811

model.foundingFather.antonioVieira.name=António Vieira
model.foundingFather.antonioVieira.description=Aumenta un 20% la probabilidad de que los nativos se conviertan.
model.foundingFather.antonioVieira.text=Jesuita, predicador y diplomático portugués que pasó décadas en Brasil defendiendo a los indígenas de la esclavitud impuesta por los colonos. Sus sermones son clásicos de la lengua portuguesa.
model.foundingFather.antonioVieira.birthAndDeath=1608-1697

model.foundingFather.roqueGonzalez.name=Roque González de Santa Cruz
model.foundingFather.roqueGonzalez.description=Los indios conversos y los expertos nativos producen 1 más de grano, azúcar, tabaco, algodón, pieles y pescado.
model.foundingFather.roqueGonzalez.text=Jesuita nacido en Asunción que fundó varias de las reducciones guaraníes del Paraguay, donde las comunidades nativas cultivaban, criaban ganado y trabajaban en oficios bajo la protección de los misioneros. Murió en 1628 y fue canonizado en 1988.
model.foundingFather.roqueGonzalez.birthAndDeath=1576-1628

model.foundingFather.felixDeAzara.name=Félix de Azara
model.foundingFather.felixDeAzara.description=Los caballos y el resto del ganado se reproducen un 50% más rápido.
model.foundingFather.felixDeAzara.text=Ingeniero militar y naturalista español que pasó veinte años en el Paraguay y el Río de la Plata. Describió cientos de especies y estudió los caballos y el ganado cimarrón de las pampas, trabajos que luego citó Darwin.
model.foundingFather.felixDeAzara.birthAndDeath=1742-1821

model.foundingFather.jorgeJuanYUlloa.name=Jorge Juan y Antonio de Ulloa
model.foundingFather.jorgeJuanYUlloa.description=Se revela el terreno alrededor de todas tus colonias. Las unidades navales ganan +1 de visión.
model.foundingFather.jorgeJuanYUlloa.text=Dos jóvenes oficiales de la Armada española que se sumaron en 1735 a la Misión Geodésica francesa al Virreinato del Perú para medir la forma de la Tierra. Sus mediciones e informes le dieron a España el conocimiento más preciso de sus tierras y costas americanas.
model.foundingFather.jorgeJuanYUlloa.birthAndDeath=1713-1773 / 1716-1795

model.foundingFather.rogerWilliams.name=Roger Williams
model.foundingFather.rogerWilliams.description=La producción de cruces aumenta un 25%. La tensión con los nativos crece un 25% más despacio.
model.foundingFather.rogerWilliams.text=Pastor puritano desterrado de Massachusetts por sus ideas, que fundó Providence y la colonia de Rhode Island sobre el principio de la libertad religiosa. Aprendió la lengua narragansett e insistió en comprarles la tierra a los nativos en lugar de quitársela.
model.foundingFather.rogerWilliams.birthAndDeath=1603-1683

model.foundingFather.jeanBaptisteColbert.name=Jean-Baptiste Colbert
model.foundingFather.jeanBaptisteColbert.description=La producción de ron, puros, tela y abrigos aumenta un 25%.
model.foundingFather.jeanBaptisteColbert.text=Ministro de finanzas de Luis XIV y gran arquitecto del mercantilismo francés. Fundó las manufacturas reales, la Compañía Francesa de las Indias Occidentales y la marina que unió a Nueva Francia y las Antillas con la metrópoli.
model.foundingFather.jeanBaptisteColbert.birthAndDeath=1619-1683

model.foundingFather.johnRolfe.name=John Rolfe
model.foundingFather.johnRolfe.description=La producción de tabaco aumenta un 50%.
model.foundingFather.johnRolfe.text=Colono inglés de Jamestown que en 1612 plantó un tabaco caribeño más suave y lo convirtió en la primera exportación rentable de Virginia. Su casamiento con Pocahontas en 1614 trajo unos años de paz con los powhatan.
model.foundingFather.johnRolfe.birthAndDeath=1585-1622

model.foundingFather.samuelDeChamplain.name=Samuel de Champlain
model.foundingFather.samuelDeChamplain.description=Un explorador veterano se une a vos en Europa. La tensión con los nativos crece un 25% más despacio.
model.foundingFather.samuelDeChamplain.text=Navegante y cartógrafo francés que fundó Quebec en 1608 y exploró el San Lorenzo y los Grandes Lagos. Su alianza con hurones y algonquinos marcó a Nueva Francia durante un siglo.
model.foundingFather.samuelDeChamplain.birthAndDeath=c.1567-1635

model.foundingFather.michielDeRuyter.name=Michiel de Ruyter
model.foundingFather.michielDeRuyter.description=Todas las unidades navales ganan un 50% de defensa.
model.foundingFather.michielDeRuyter.text=El almirante más célebre de la República Neerlandesa. Les hizo frente a las flotas inglesa y francesa y dirigió en 1667 el ataque al río Medway, donde incendió a la flota inglesa fondeada.
model.foundingFather.michielDeRuyter.birthAndDeath=1607-1676

model.foundingFather.vauban.name=Vauban
model.foundingFather.vauban.description=Comprar empalizadas, fuertes y fortalezas cuesta un 50% menos.
model.foundingFather.vauban.text=Sébastien Le Prestre, marqués de Vauban, ingeniero militar de Luis XIV. Construyó o reformó más de cien fortalezas, y sus fuertes en forma de estrella se copiaron en toda Europa y América.
model.foundingFather.vauban.birthAndDeath=1633-1707

model.foundingFather.marieDeLIncarnation.name=María de la Encarnación
model.foundingFather.marieDeLIncarnation.description=Se construye gratis una escuela en cada colonia que pueda tenerla.
model.foundingFather.marieDeLIncarnation.text=Monja ursulina que llegó a Quebec en 1639 y fundó la primera escuela para niñas de América del Norte, abierta a alumnas francesas y nativas. Escribió además diccionarios de las lenguas algonquina e iroquesa.
model.foundingFather.marieDeLIncarnation.birthAndDeath=1599-1672
