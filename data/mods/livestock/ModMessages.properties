model.goods.cows.name={{plural:%amount%|one=Cattle|other=Cattle|default=Cattle}}
model.goods.cows.description=Cattle imported from Europe. With two or more in a colony and a cattle pen they breed when food is available. The dairy needs them to make milk; a Europe boycott only blocks repurchase — local breeding continues.
model.goods.sheep.name={{plural:%amount%|one=Sheep|other=Sheep|default=Sheep}}
model.goods.sheep.description=Sheep imported from Europe. With two or more in a colony and a sheepfold they breed when food is available. The wool shed needs them to make wool; a Europe boycott only blocks repurchase — local breeding continues.
model.goods.milk.name={{plural:%amount%|one=Milk|other=Milk|default=Milk}}
model.goods.milk.description=Fresh milk from the dairy. Not eaten by colonists; used to make cheese.
model.goods.milk.workAs=Work as Dairy Worker %claim%(%amount% Milk)
model.goods.milk.workingAs=a Dairy Worker
model.goods.wool.name={{plural:%amount%|one=Wool|other=Wool|default=Wool}}
model.goods.wool.description=Wool from the sheepfold shed. Woven into cloth in the weaver's house as an alternative to cotton.
model.goods.wool.workAs=Work as Shepherd %claim%(%amount% Wool)
model.goods.wool.workingAs=a Shepherd
model.goods.cheese.name={{plural:%amount%|one=Cheese|other=Cheese|default=Cheese}}
model.goods.cheese.description=Aged cheese made from milk. A valuable export good for Europe, or food for patron-saint feasts in the brotherhood hall.
model.goods.cheese.workAs=Work as Cheesemaker %claim%(%amount% Cheese)
model.goods.cheese.workingAs=a Cheesemaker

model.building.cattlePen.name=Cattle pen
model.building.cattlePen.description=Breeds cattle from surplus food when at least two cattle are present. Costs 32 hammers to build.
model.building.sheepfold.name=Sheepfold
model.building.sheepfold.description=Breeds sheep from surplus food when at least two sheep are present. Costs 32 hammers to build.
model.building.dairy.name=Dairy
model.building.dairy.description=Dairy workers milk the herd: each worker makes 3 milk per turn and uses up 1 cow. Keep a cattle pen so the herd grows faster than the dairy uses it.
model.building.woolShed.name=Wool shed
model.building.woolShed.description=Shepherds shear the flock: each worker makes 3 wool per turn and uses up 1 sheep. Keep a sheepfold so the flock grows faster than the shed uses it.
model.building.cheeseHouse.name=Cheese house
model.building.cheeseHouse.description=Turns milk into cheese for export.
model.building.cheeseShop.name=Cheese shop
model.building.cheeseShop.description=Upgraded cheese house with higher milk-to-cheese production.
model.building.brotherhoodHall.name=Brotherhood hall
model.building.brotherhoodHall.description=A religious brotherhood that organizes patron-saint feasts, whose banquets draw new settlers. Consumes 2 cheese per turn from the warehouse and produces 1 cross, with no workers needed; 1 extra cross at 50% rebels and 2 at 100%. Move the cheese out of the colony if you would rather sell it. Requires population 3; costs 48 hammers.
model.building.weaverHouse.description=Weaves cotton or wool into cloth.
model.building.weaverShop.description=Improved weaving of cotton or wool into cloth.
model.building.textileMill.description=Factory weaving of cotton or wool into cloth.
