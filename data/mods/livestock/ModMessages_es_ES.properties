model.goods.cows.name={{plural:%amount%|one=Vacas|other=Vacas|default=Vacas}}
model.goods.cows.description=Ganado traído de Europa. Con dos o más en una colonia con corral se crían si hay comida. La lechería las necesita para hacer leche. Un boicot en Europa solo impide volver a comprar; la cría local sigue.
model.goods.sheep.name={{plural:%amount%|one=Ovejas|other=Ovejas|default=Ovejas}}
model.goods.sheep.description=Ovejas traídas de Europa. Con dos o más en una colonia con redil se crían si hay comida. El cobertizo las necesita para hacer lana; un boicot solo bloquea la recompra.
model.goods.milk.name={{plural:%amount%|one=Leche|other=Leche|default=Leche}}
model.goods.milk.description=Leche fresca de la lechería. Los colonos no la comen; se usa para hacer queso.
model.goods.milk.workAs=Trabajar como Lechero %claim%(%amount% Leche)
model.goods.milk.workingAs=un Lechero
model.goods.wool.name={{plural:%amount%|one=Lana|other=Lana|default=Lana}}
model.goods.wool.description=Lana del cobertizo. Se teje en paño en el taller del tejedor, como alternativa al algodón.
model.goods.wool.workAs=Trabajar como Pastor %claim%(%amount% Lana)
model.goods.wool.workingAs=un Pastor
model.goods.cheese.name={{plural:%amount%|one=Queso|other=Queso|default=Queso}}
model.goods.cheese.description=Queso elaborado a partir de leche. Valioso para exportar a Europa o para los banquetes de las fiestas patronales en la casa de la cofradía.
model.goods.cheese.workAs=Trabajar como Quesero %claim%(%amount% Queso)
model.goods.cheese.workingAs=un Quesero

model.building.cattlePen.name=Corral de vacas
model.building.cattlePen.description=Cría vacas con comida sobrante cuando hay al menos dos. Cuesta 32 hammers construirlo.
model.building.sheepfold.name=Redil
model.building.sheepfold.description=Cría ovejas con comida sobrante cuando hay al menos dos. Cuesta 32 hammers construirlo.
model.building.dairy.name=Lechería
model.building.dairy.description=Los lecheros ordeñan el rebaño: cada uno hace 3 de leche por turno y gasta 1 vaca. Tené un corral para que el rebaño crezca más rápido de lo que la lechería lo gasta.
model.building.woolShed.name=Cobertizo de lana
model.building.woolShed.description=Los pastores esquilan el rebaño: cada uno hace 3 de lana por turno y gasta 1 oveja. Tené un redil para que el rebaño crezca más rápido de lo que el cobertizo lo gasta.
model.building.cheeseHouse.name=Quesería
model.building.cheeseHouse.description=Convierte leche en queso para exportar.
model.building.cheeseShop.name=Tienda de quesos
model.building.cheeseShop.description=Quesería mejorada con más producción de queso.
model.building.brotherhoodHall.name=Casa de la cofradía
model.building.brotherhoodHall.description=Una cofradía religiosa que organiza las fiestas patronales, cuyos banquetes atraen nuevos colonos. Consume 2 de queso por turno del depósito y produce 1 cruz, sin necesidad de trabajadores; 1 cruz más con 50% de rebeldes y 2 más con 100%. Si preferís venderlo, sacá el queso de la colonia. Requiere población 3; cuesta 48 martillos.
model.building.weaverHouse.description=Teje algodón o lana para hacer paño.
model.building.weaverShop.description=Tejeduría mejorada de algodón o lana a paño.
model.building.textileMill.description=Fábrica textil de algodón o lana a paño.
