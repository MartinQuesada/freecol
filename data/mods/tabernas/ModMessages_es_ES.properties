model.building.tavern.name=Taberna
model.building.tavern.description=Los colonos se juntan a beber y a hablar de política. Consume 2 de ron por turno del depósito y produce 1 campana de libertad, sin necesidad de trabajadores; 1 campana más con 50% de rebeldes y 2 más con 100%. Si preferís venderlo, sacá el ron de la colonia. Cuesta 40 martillos.
