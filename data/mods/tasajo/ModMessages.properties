# Meat: hunted on forests, stored in the warehouse (not eaten — for salting).
model.goods.meat.name={{plural:%amount%|one=Meat|other=Meat|default=Meat}}
model.goods.meat.description=Fresh game meat from hunting. It is stored in the warehouse and cured with salt into salt meat in a salting house. Colonists do not eat it — they still need grain or fish.
model.goods.meat.workAs=Work as Hunter %claim%(%amount% Meat)
model.goods.meat.workingAs=a Hunter

# Salt: mined on hills, mountains, and desert salt flats.
model.goods.salt.name={{plural:%amount%|one=Salt|other=Salt|default=Salt}}
model.goods.salt.description=Salt is mined from hills and mountains or gathered on desert salt flats. Together with meat it is used to cure salt meat in a salting house.
model.goods.salt.workAs=Work as Salt Miner %claim%(%amount% Salt)
model.goods.salt.workingAs=a Salt Miner

# Salt meat / tasajo (export luxury, not food).
model.goods.saltMeat.name={{plural:%amount%|one=Salt meat|other=Salt meat|default=Salt meat}}
model.goods.saltMeat.description=Salted and dried meat (tasajo) prepared for long storage and export to Europe. Made from meat and salt in a salting house.
model.goods.saltMeat.workAs=Work as Meat Salter %claim%(%amount% Salt meat)
model.goods.saltMeat.workingAs=a Meat Salter

model.building.saltingHouse.name=Salting house
model.building.saltingHouse.description=The salting house cures meat with salt into salt meat for export. It costs 32 hammers to build (like other workshops under Basic Buildings) and can be upgraded to a salting works and later a packing house.

model.building.saltingWorks.name=Salting works
model.building.saltingWorks.description=The salting works upgrades the salting house and doubles salt meat production. It can be upgraded further to a packing house once Adam Smith has joined Congress and the colony reaches population 8.

model.building.packingHouse.name=Packing house
model.building.packingHouse.description=The packing house is the factory-tier upgrade of the salting works. It requires Adam Smith and a colony population of at least 8, and further increases salt meat production.

model.unit.expertHunter.name={{plural:%number%|one=Expert Hunter|other=Expert Hunters|default=Expert Hunter}}
model.unit.expertHunter.description=The Expert Hunter specializes in hunting meat on forest tiles.
model.unit.expertHunter.workingAs=Hunter

model.unit.expertSaltMiner.name={{plural:%number%|one=Expert Salt Miner|other=Expert Salt Miners|default=Expert Salt Miner}}
model.unit.expertSaltMiner.description=The Expert Salt Miner excels at mining salt from hills, mountains, and desert salt flats.
model.unit.expertSaltMiner.workingAs=Salt Miner

model.unit.masterSalter.name={{plural:%number%|one=Expert Meat Salter|other=Expert Meat Salters|default=Expert Meat Salter}}
model.unit.masterSalter.description=The Expert Meat Salter doubles salt meat production when working in a salting house, salting works, or packing house.
model.unit.masterSalter.workingAs=Meat Salter

model.resource.game.description=The forest is home to many animals, suitable for hunting for furs or meat.
model.resource.salt.name=Salt
model.resource.salt.description=A rich salt deposit or salt flat. Salt miners extract more salt here.

model.unit.nativeExpertHunter.name={{plural:%number%|one=Native Expert Hunter|other=Native Expert Hunters|default=Native Expert Hunter}}
model.unit.nativeExpertHunter.description=A convert who mastered hunting by experience. Remains a convert: no colonies, poor indoor work, no teaching. Requires the Converts mod.
model.unit.nativeExpertSaltMiner.name={{plural:%number%|one=Native Expert Salt Miner|other=Native Expert Salt Miners|default=Native Expert Salt Miner}}
model.unit.nativeExpertSaltMiner.description=A convert who mastered salt mining by experience. Remains a convert: no colonies, poor indoor work, no teaching. Requires the Converts mod.
