# Carne: se caza en bosques y se guarda en el almacén (no se come; es para salar).
model.goods.meat.name={{plural:%amount%|one=Carne|other=Carne|default=Carne}}
model.goods.meat.description=Carne fresca de caza. Se guarda en el almacén y, junto con la sal, se cura como tasajo en un saladero. Los colonos no la comen: siguen necesitando grano o pescado.
model.goods.meat.workAs=Trabajar como Cazador %claim%(%amount% Carne)
model.goods.meat.workingAs=un Cazador

# Sal: se mina en colinas, montañas y salinas del desierto.
model.goods.salt.name={{plural:%amount%|one=Sal|other=Sal|default=Sal}}
model.goods.salt.description=La sal se mina en colinas y montañas o se recoge en salinas del desierto. Junto con la carne se usa para curar tasajo en un saladero.
model.goods.salt.workAs=Trabajar como Minero de sal %claim%(%amount% Sal)
model.goods.salt.workingAs=un Minero de sal

# Tasajo (lujo exportable, no es comida).
model.goods.saltMeat.name={{plural:%amount%|one=Tasajo|other=Tasajo|default=Tasajo}}
model.goods.saltMeat.description=Carne salada y seca preparada para almacenar y exportar a Europa. Se elabora con carne y sal en un saladero.
model.goods.saltMeat.workAs=Trabajar como Salador de carne %claim%(%amount% Tasajo)
model.goods.saltMeat.workingAs=un Salador de carne

model.building.saltingHouse.name=Saladero
model.building.saltingHouse.description=El saladero cura la carne con sal para producir tasajo exportable. Cuesta 32 hammers construirlo (como el resto de talleres con Basic Buildings) y puede evolucionar a saladero mayor y luego a empacadora.

model.building.saltingWorks.name=Saladero mayor
model.building.saltingWorks.description=El saladero mayor mejora el saladero y duplica la producción de tasajo. Puede evolucionar a empacadora cuando Adam Smith esté en el Congreso y la colonia alcance 8 de población.

model.building.packingHouse.name=Empacadora
model.building.packingHouse.description=La empacadora es la mejora de fábrica del saladero mayor. Requiere a Adam Smith y una población de al menos 8, y aumenta aún más la producción de tasajo.

model.unit.expertHunter.name={{plural:%number%|one=Cazador experto|other=Cazadores expertos|default=Cazador experto}}
model.unit.expertHunter.description=El cazador experto se especializa en obtener carne en los bosques.
model.unit.expertHunter.workingAs=Cazador

model.unit.expertSaltMiner.name={{plural:%number%|one=Minero de sal experto|other=Mineros de sal expertos|default=Minero de sal experto}}
model.unit.expertSaltMiner.description=El minero de sal experto obtiene más sal en colinas, montañas y salinas del desierto.
model.unit.expertSaltMiner.workingAs=Minero de sal

model.unit.masterSalter.name={{plural:%number%|one=Salador de carne experto|other=Saladores de carne expertos|default=Salador de carne experto}}
model.unit.masterSalter.description=El salador de carne experto duplica la producción de tasajo al trabajar en un saladero, saladero mayor o empacadora.
model.unit.masterSalter.workingAs=Salador de carne

model.resource.game.description=El bosque alberga muchos animales, aptos para cazar pieles o carne.
model.resource.salt.name=Sal
model.resource.salt.description=Un yacimiento o salina rico en sal. Los mineros de sal extraen más sal aquí.

model.unit.nativeExpertHunter.name={{plural:%number%|one=Cazador nativo experto|other=Cazadores nativos expertos|default=Cazador nativo experto}}
model.unit.nativeExpertHunter.description=Un converso que dominó la caza con la experiencia. Sigue siendo converso: no funda colonias, rinde poco en los edificios y no enseña. Requiere el mod Conversos.
model.unit.nativeExpertSaltMiner.name={{plural:%number%|one=Salinero nativo experto|other=Salineros nativos expertos|default=Salinero nativo experto}}
model.unit.nativeExpertSaltMiner.description=Un converso que dominó la extracción de sal con la experiencia. Sigue siendo converso: no funda colonias, rinde poco en los edificios y no enseña. Requiere el mod Conversos.
