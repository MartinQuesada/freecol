model.building.tertulia.name=Tertulia
model.building.tertulia.description=Colonial politicians meet to smoke and plot. Consumes 2 cigars per turn from the warehouse and produces 1 liberty bell, with no workers needed; 1 extra bell at 50% rebels and 2 at 100%. Move the cigars out of the colony if you would rather sell them. Requires population 3; costs 48 hammers.
