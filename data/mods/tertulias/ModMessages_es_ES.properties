model.building.tertulia.name=Tertulia
model.building.tertulia.description=Los políticos de la colonia se reúnen a fumar y a urdir planes. Consume 2 de cigarros por turno del depósito y produce 1 campana de libertad, sin necesidad de trabajadores; 1 campana más con 50% de rebeldes y 2 más con 100%. Si preferís venderlos, sacá los cigarros de la colonia. Requiere población 3; cuesta 48 martillos.
